<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theki Studios — Photography & Film</title>
    <meta name="description" content="Weddings, cars and portraits, shot with patience and finished with care. Theki Studios photography and film." />
    <meta property="og:title" content="Theki Studios — Photography & Film" />
    <meta property="og:description" content="Frames worth keeping. Weddings, cars and portraits." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; overflow-x: clip; }
      body { background: #F0E8D1; color: #433021; }
      /* Cold open: stage overlay fades */
      .cold-open {
        position: fixed; inset: 0; z-index: 999;
        background: #241A12;
        opacity: 0.7;
        animation: coldOpenFade 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
        pointer-events: none;
      }
      @keyframes coldOpenFade {
        to { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cold-open { animation: none; opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="cold-open" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
