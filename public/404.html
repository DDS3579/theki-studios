<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Theki Studios</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #241A12; color: #F0E8D1; }
      body { display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
      p.code { margin: 0 0 12px; font: 12px/1 ui-monospace, monospace; letter-spacing: 0.25em; color: #B7AE9B; text-transform: uppercase; }
      h1 { margin: 0 0 16px; font: 800 clamp(2.5rem, 9vw, 5rem)/0.95 Impact, 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
      p.text { margin: 0 0 32px; color: #B7AE9B; max-width: 28rem; line-height: 1.6; }
      a { display: inline-block; border-bottom: 1px solid #A07F3E; padding-bottom: 4px; color: #F0E8D1; text-decoration: none; font: 12px/1 ui-monospace, monospace; letter-spacing: 0.2em; text-transform: uppercase; }
      a:focus-visible { outline: 2px solid #A07F3E; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p class="text">The page you are looking for does not exist or has moved.</p>
      <a href="/">Back to Theki Studios</a>
    </main>
  </body>
</html>
